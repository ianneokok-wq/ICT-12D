<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Core Memories</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style2.css">
</head>
<body>

  <!-- AUDIO PROMPT -->
  <div id="audioPrompt">
    <div class="prompt-box">
      <h2>Turn on sound?</h2>
      <p>This experience includes audio.</p>
      <div class="buttons">
        <button id="yesAudio">Yes</button>
        <button id="noAudio">No</button>
      </div>
    </div>
  </div>

  <div id="wrapper">

    <section class="section active">
      <video class="bg-video" autoplay muted loop playsinline>
        <source src="videos/clear.mp4" type="video/mp4">
      </video>
      <h1>Core!</h1>
      <p>sucks</p>
    </section>

    <section class="section">
      <video class="bg-video" autoplay muted loop playsinline>
        <source src="videos/cute.mp4" type="video/mp4">
      </video>
      <h1>SECTION 2</h1>
      <p>Characters</p>
    </section>

    <section class="section">
      <video class="bg-video" autoplay muted loop playsinline>
        <source src="videos/cuter.mp4" type="video/mp4">
      </video>
      <h1>SECTION 3</h1>
      <p>Features</p>
    </section>

  </div>

  <script src="script2.js"></script>
</body>
